services:
  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env.example
    environment:
      DATABASE_URL: postgresql://voicelens:voicelens@postgres:5432/voicelens
      REDIS_URL: redis://redis:6379/0
      AUTH_REQUIRED: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/ready')"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: voicelens
      POSTGRES_USER: voicelens
      POSTGRES_PASSWORD: voicelens
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voicelens -d voicelens"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  worker:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    command: celery -A services.api.app.celery_app:celery_app worker --loglevel=info
    env_file:
      - .env.example
    environment:
      DATABASE_URL: postgresql://voicelens:voicelens@postgres:5432/voicelens
      REDIS_URL: redis://redis:6379/0
      AUTH_REQUIRED: "true"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy
