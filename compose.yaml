services:
  # 一次性迁移:模型新增列不会被 create_all 补上,必须先 upgrade head
  migrate:
    # 14.5 的镜像级回滚要求每个服务有固定 tag:回滚时改 tag 再 up -d,
    # 而不是 git checkout + rebuild(那会把「回到上一版」变成一次新构建)。
    image: voice-migrate:${VOICELENS_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: services/api/Dockerfile
    command: sh -c "cd services/api && alembic -c alembic.ini upgrade head"
    env_file:
      - .env.example
    environment:
      DATABASE_URL: postgresql+psycopg://voicelens:voicelens@postgres:5432/voicelens
      USE_DATABASE: "1"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    # 14.5 的镜像级回滚要求每个服务有固定 tag:回滚时改 tag 再 up -d,
    # 而不是 git checkout + rebuild(那会把「回到上一版」变成一次新构建)。
    image: voice-api:${VOICELENS_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: services/api/Dockerfile
    env_file:
      - .env.example
    environment:
      DATABASE_URL: postgresql+psycopg://voicelens:voicelens@postgres:5432/voicelens
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      USE_DATABASE: "1"
      # 队列是这套栈的事实组件(celery + relay),readiness 如实报告;
      # 调度统一走 outbox,这一键只影响 /health/ready 的 queue 字段。
      USE_CELERY: "1"
      # 闸门相关开关全部走插值:开发默认保持演示口径,生产用根目录 .env 覆盖
      # (docker compose 自动读取该文件做插值)。把它们钉成字面量等于焊死
      # VOICELENS_ENV=production 的覆盖入口——生产闸门(settings.py)就永远咬不上。
      VOICELENS_ENV: ${VOICELENS_ENV:-development}
      AUTH_REQUIRED: ${AUTH_REQUIRED:-true}
      AUTH_INSECURE_DEV: ${AUTH_INSECURE_DEV:-true}
      SESSION_STORE: ${SESSION_STORE:-db}
      DEDUPE_HMAC_SECRET: ${DEDUPE_HMAC_SECRET:-}
      IDENTITY_PROVIDER: ${IDENTITY_PROVIDER:-local}
      LOCAL_ACCOUNTS: ${LOCAL_ACCOUNTS:-}
      NAMING_MODE: ${NAMING_MODE:-mock}
      EMBEDDING_MODE: ${EMBEDDING_MODE:-hashing}
      # 校验(settings.py)需要知道 provider 的端点/模型/价格,但密钥只进 worker(14.1):
      # MODEL_API_KEY / EMBEDDING_API_KEY 有意不出现在 api 服务里。
      MODEL_PROVIDER: ${MODEL_PROVIDER:-http}
      MODEL_BASE_URL: ${MODEL_BASE_URL:-}
      MODEL_ENDPOINT: ${MODEL_ENDPOINT:-}
      MODEL_ID: ${MODEL_ID:-}
      MODEL_PRICE_IN: ${MODEL_PRICE_IN:-}
      MODEL_PRICE_OUT: ${MODEL_PRICE_OUT:-}
      DAILY_MODEL_BUDGET: ${DAILY_MODEL_BUDGET:-}
      EMBEDDING_ENDPOINT: ${EMBEDDING_ENDPOINT:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/ready')"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    # 14.5 的镜像级回滚要求每个服务有固定 tag:回滚时改 tag 再 up -d,
    # 而不是 git checkout + rebuild(那会把「回到上一版」变成一次新构建)。
    image: voice-web:${VOICELENS_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # compose 栈默认真实 API 模式:8080 的演示走真后端/真库/真 worker,
        # 不再是前端自演(mock bundle 连一次后端都不会调)。mock 演示保留在
        # npm run dev。VITE_USE_MOCK 是构建期变量,由 Dockerfile 烘进镜像。
        VITE_USE_MOCK: "${VOICELENS_WEB_USE_MOCK:-false}"
    ports:
      - "8080:8080"
    depends_on:
      api:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: voicelens
      POSTGRES_USER: voicelens
      POSTGRES_PASSWORD: voicelens
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voicelens -d voicelens"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  worker:
    # 14.5 的镜像级回滚要求每个服务有固定 tag:回滚时改 tag 再 up -d,
    # 而不是 git checkout + rebuild(那会把「回到上一版」变成一次新构建)。
    image: voice-worker:${VOICELENS_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: services/api/Dockerfile
    command: celery -A services.api.app.celery_app:celery_app worker --loglevel=info
    env_file:
      - .env.example
    environment:
      DATABASE_URL: postgresql+psycopg://voicelens:voicelens@postgres:5432/voicelens
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      USE_DATABASE: "1"
      # 14.1:模型密钥只在 worker 进程注入——api 容器不持有。
      # 命名/向量 provider 全部在 worker 里跑(pipeline);这些键此前不在任何
      # 注入面上,NAMING_MODE=provider 也拿不到端点,llm.py 会静默降级 manual。
      # 空字符串与未设置等价:下游一律 (os.getenv(...) or '').strip()。
      NAMING_MODE: ${NAMING_MODE:-mock}
      EMBEDDING_MODE: ${EMBEDDING_MODE:-hashing}
      MODEL_BASE_URL: ${MODEL_BASE_URL:-}
      MODEL_ENDPOINT: ${MODEL_ENDPOINT:-}
      MODEL_ID: ${MODEL_ID:-}
      MODEL_API_KEY: ${MODEL_API_KEY:-}
      MODEL_TIMEOUT_SECONDS: ${MODEL_TIMEOUT_SECONDS:-}
      MODEL_PRICE_IN: ${MODEL_PRICE_IN:-}
      MODEL_PRICE_OUT: ${MODEL_PRICE_OUT:-}
      DAILY_MODEL_BUDGET: ${DAILY_MODEL_BUDGET:-}
      EMBEDDING_ENDPOINT: ${EMBEDDING_ENDPOINT:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_REVISION: ${EMBEDDING_REVISION:-}
      EMBEDDING_TIMEOUT_SECONDS: ${EMBEDDING_TIMEOUT_SECONDS:-}
      EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  relay:
    # 14.5 的镜像级回滚要求每个服务有固定 tag:回滚时改 tag 再 up -d,
    # 而不是 git checkout + rebuild(那会把「回到上一版」变成一次新构建)。
    image: voice-relay:${VOICELENS_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: services/api/Dockerfile
    command: python -m services.api.app.relay_runner
    env_file:
      - .env.example
    environment:
      DATABASE_URL: postgresql+psycopg://voicelens:voicelens@postgres:5432/voicelens
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      USE_DATABASE: "1"
      OUTBOX_RELAY_INTERVAL_SECONDS: ${OUTBOX_RELAY_INTERVAL_SECONDS:-5}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # §14.2:watchdog 独立成服务,worker 崩溃后由它把租约过期的 running 作业重排队。
  # app/watchdog.py 只有类、没有 __main__,所以这里用具名 heredoc 显式跑循环;
  # `python -m services.api.app.watchdog` 会静默退出——正是「看起来接通、实际是哑的」。
  # 注意 relay_runner 目前也内联跑同一个 pass,两处并发是已知重复;
  # 但要拆开必须改 relay_runner(非本文件职责),见 docs/runbooks/restore.md 的已知问题。
  watchdog:
    # 14.5 的镜像级回滚要求每个服务有固定 tag:回滚时改 tag 再 up -d,
    # 而不是 git checkout + rebuild(那会把「回到上一版」变成一次新构建)。
    image: voice-watchdog:${VOICELENS_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: services/api/Dockerfile
    command:
      - sh
      - -c
      - |
        exec python - <<'PY'
        import logging, os, signal, time
        from services.api.app.repository import get_repository
        from services.api.app.watchdog import RunWatchdog

        logging.basicConfig(level=os.getenv("LOG_LEVEL", "INFO"))
        log = logging.getLogger("watchdog")
        interval = max(1.0, float(os.getenv("WATCHDOG_INTERVAL_SECONDS", "30")))
        stop = False

        def _request_stop(signum, _frame):
            global stop
            stop = True
            log.info("received signal %s; stopping watchdog", signum)

        signal.signal(signal.SIGTERM, _request_stop)
        signal.signal(signal.SIGINT, _request_stop)
        watchdog = RunWatchdog(get_repository().analyses)
        log.info("watchdog started (interval=%ss)", interval)
        while not stop:
            try:
                result = watchdog.recover_stale()
                if result.get("recovered") or result.get("errored"):
                    log.info("watchdog pass: %s", result)
            except Exception:
                log.exception("watchdog pass failed")
            deadline = time.monotonic() + interval
            while not stop and time.monotonic() < deadline:
                time.sleep(min(0.5, deadline - time.monotonic()))
        log.info("watchdog stopped")
        PY
    env_file:
      - .env.example
    environment:
      DATABASE_URL: postgresql+psycopg://voicelens:voicelens@postgres:5432/voicelens
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      USE_DATABASE: "1"
      WATCHDOG_INTERVAL_SECONDS: ${WATCHDOG_INTERVAL_SECONDS:-30}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

