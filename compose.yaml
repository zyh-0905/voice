services:
  # 一次性迁移:模型新增列不会被 create_all 补上,必须先 upgrade head
  migrate:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    command: sh -c "cd services/api && alembic -c alembic.ini upgrade head"
    env_file:
      - .env.example
    environment:
      DATABASE_URL: postgresql+psycopg://voicelens:voicelens@postgres:5432/voicelens
      USE_DATABASE: "1"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    env_file:
      - .env.example
    environment:
      DATABASE_URL: postgresql+psycopg://voicelens:voicelens@postgres:5432/voicelens
      REDIS_URL: redis://redis:6379/0
      AUTH_REQUIRED: "true"
      AUTH_INSECURE_DEV: "true"
      USE_DATABASE: "1"
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/ready')"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      api:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: voicelens
      POSTGRES_USER: voicelens
      POSTGRES_PASSWORD: voicelens
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voicelens -d voicelens"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  worker:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    command: celery -A services.api.app.celery_app:celery_app worker --loglevel=info
    env_file:
      - .env.example
    environment:
      DATABASE_URL: postgresql+psycopg://voicelens:voicelens@postgres:5432/voicelens
      REDIS_URL: redis://redis:6379/0
      AUTH_REQUIRED: "true"
      AUTH_INSECURE_DEV: "true"
      USE_DATABASE: "1"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  relay:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    command: python -m services.api.app.relay_runner
    env_file:
      - .env.example
    environment:
      DATABASE_URL: postgresql+psycopg://voicelens:voicelens@postgres:5432/voicelens
      REDIS_URL: redis://redis:6379/0
      AUTH_REQUIRED: "true"
      AUTH_INSECURE_DEV: "true"
      USE_DATABASE: "1"
      OUTBOX_RELAY_INTERVAL_SECONDS: "5"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

