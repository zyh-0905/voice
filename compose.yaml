services:
  api:
    build: ./services/api
    ports: ["8000:8000"]
    env_file: .env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: voicelens
      POSTGRES_USER: voicelens
      POSTGRES_PASSWORD: voicelens
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voicelens -d voicelens"]
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
