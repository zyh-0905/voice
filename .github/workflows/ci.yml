name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: voicelens
          POSTGRES_PASSWORD: voicelens
          POSTGRES_DB: voicelens
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U voicelens -d voicelens"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12
    env:
      DATABASE_URL: postgresql+psycopg://voicelens:voicelens@localhost:5432/voicelens
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip && pip install -r services/api/requirements.txt PyYAML
      - run: python scripts/validate-compose.py
      - working-directory: services/api
        run: alembic -c alembic.ini upgrade head
      - run: python -m compileall services/api/app
      - run: PYTHONPATH=services/api pytest services/api/tests -q
      - name: Database readiness smoke
        run: >-
          python -c "from sqlalchemy import create_engine, text;
          e=create_engine('${{ env.DATABASE_URL }}');
          with e.connect() as c: assert c.execute(text('SELECT 1')).scalar() == 1"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - working-directory: apps/web
        run: npm ci
      - working-directory: apps/web
        run: npm run typecheck
      - working-directory: apps/web
        run: npm run test:unit -- --run
      - working-directory: apps/web
        run: npm run build
      - working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - working-directory: apps/web
        run: npm run test:e2e -- --project=chromium --workers=1

